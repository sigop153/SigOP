# Symptom2Disease: English symptom descriptions to one of 22 diseases.
# Splits and scoring follow Meta-Harness's text-classification task; see ../README.md.
name = "Symptom2Disease"
scorer = "exact"
answer_open = "[DIAGNOSIS]"
answer_close = "[/DIAGNOSIS]"
# Meta-Harness's evaluator also accepted an untagged "diagnosis: X" line; kept for parity.
answer_fallback_pattern = "(?:diagnosis|final diagnosis|conclusion)[:：]\\s*([^\\n]+)"
temperature = 0.0
samples = 1
labels = [
    "drug reaction", "allergy", "chicken pox", "diabetes", "psoriasis", "hypertension",
    "cervical spondylosis", "bronchial asthma", "varicose veins", "malaria", "dengue", "arthritis",
    "impetigo", "fungal infection", "common cold", "gastroesophageal reflux disease",
    "urinary tract infection", "typhoid", "pneumonia", "peptic ulcer disease", "jaundice", "migraine",
]
prompt = """You are an expert medical diagnostician. Based on the patient's symptoms, provide a diagnosis.

Possible diagnoses include: drug reaction, allergy, chicken pox, diabetes, psoriasis, hypertension, cervical spondylosis, bronchial asthma, varicose veins, malaria, dengue, arthritis, impetigo, fungal infection, common cold, gastroesophageal reflux disease, urinary tract infection, typhoid, pneumonia, peptic ulcer disease, jaundice, migraine.

Please analyze the symptoms step by step, then provide your final diagnosis in the format:
[DIAGNOSIS]diagnosis_name[/DIAGNOSIS]

For example:
[DIAGNOSIS]diabetes[/DIAGNOSIS]


## Patient Symptoms
{input}

Please provide your reasoning and final diagnosis."""
